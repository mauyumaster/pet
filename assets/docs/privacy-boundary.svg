<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <text x="20" y="30" fill="#1c202a" font-size="15px" font-weight="600">她能看见什么 —— 四档感知与「本机 / 外发」的分界</text>
  <text x="20" y="50" fill="#687082" font-size="11px">越往下权限越大。前两档出不了这台电脑；第三档是唯一会把屏幕内容送出去的开关。</text>

  <rect x="20" y="68" width="404" height="376" rx="10" fill="#f4f8f4" stroke="#cfe3cf" stroke-width="1"/>
  <text x="40" y="92" fill="#3d7a3d" font-size="12px" font-weight="600">本机边界内 —— 文字不出这台电脑</text>
  <text x="40" y="110" fill="#6b8f6b" font-size="10px">全程用 Windows 自带识别器，不联网、不花钱</text>

  <rect x="444" y="68" width="256" height="376" rx="10" fill="#fdf4f2" stroke="#eccfc8" stroke-width="1"/>
  <text x="464" y="92" fill="#a8442f" font-size="12px" font-weight="600">会离开这台电脑</text>
  <text x="464" y="110" fill="#b57a6d" font-size="10px">只有你主动打开下面这个开关才会发生</text>

  <rect x="40" y="126" width="364" height="76" rx="7" fill="#ffffff" stroke="#dbe7db" stroke-width="1"/>
  <circle cx="62" cy="150" r="11" fill="#dfeedf"/>
  <text x="62" y="154" fill="#3d7a3d" font-size="10px" text-anchor="middle" font-weight="700">A</text>
  <text x="82" y="147" fill="#1c202a" font-size="12px" font-weight="600">进程名（始终开启）</text>
  <text x="82" y="165" fill="#687082" font-size="10px">她只知道当前前台程序叫什么，例：msedge、Code、notepad</text>
  <text x="82" y="182" fill="#8ba88b" font-size="10px">不含窗口标题、不含任何文字内容</text>

  <rect x="40" y="214" width="364" height="104" rx="7" fill="#ffffff" stroke="#dbe7db" stroke-width="1"/>
  <circle cx="62" cy="238" r="11" fill="#dfeedf"/>
  <text x="62" y="242" fill="#3d7a3d" font-size="10px" text-anchor="middle" font-weight="700">D</text>
  <text x="82" y="235" fill="#1c202a" font-size="12px" font-weight="600">屏幕文字（本机识别）</text>
  <text x="82" y="253" fill="#687082" font-size="10px">设置项：允许她在本机读屏幕上的字</text>
  <text x="82" y="270" fill="#8ba88b" font-size="10px">读到的字用来在本机判断「你切到了什么页面」</text>
  <text x="82" y="287" fill="#8ba88b" font-size="10px">这一步仍然没有任何内容离开你的电脑</text>
  <rect x="40" y="326" width="364" height="98" rx="7" fill="#ffffff" stroke="#e4e7ee" stroke-width="1"/>
  <circle cx="62" cy="350" r="11" fill="#eceef4"/>
  <text x="62" y="354" fill="#687082" font-size="10px" text-anchor="middle" font-weight="700">L4</text>
  <text x="82" y="347" fill="#687082" font-size="12px" font-weight="600">像素级看屏幕（未实现）</text>
  <text x="82" y="365" fill="#969dac" font-size="10px">当前版本未接线，勾了也没有作用</text>
  <text x="82" y="382" fill="#969dac" font-size="10px">权限性质与前几档不同，接上前会单独说明</text>

  <line x1="424" y1="120" x2="424" y2="404" stroke="#c9cedb" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="424" y="424" fill="#969dac" font-size="10px" text-anchor="middle">分界线</text>

  <rect x="464" y="126" width="216" height="112" rx="7" fill="#ffffff" stroke="#f0d9d3" stroke-width="1"/>
  <rect x="464" y="126" width="216" height="4" rx="2" fill="#d4735a"/>
  <text x="484" y="152" fill="#a8442f" font-size="12px" font-weight="600">把读到的字放进提示</text>
  <text x="484" y="170" fill="#687082" font-size="10px">设置项：把读到的字放进提示（会发出去）</text>
  <text x="484" y="192" fill="#a8442f" font-size="10px">⚠ 这是唯一会把屏幕内容</text>
  <text x="484" y="207" fill="#a8442f" font-size="10px">   送出这台电脑的开关</text>
  <text x="484" y="226" fill="#969dac" font-size="10px">默认关。开了她才能针对内容吐槽</text>

  <rect x="464" y="252" width="216" height="86" rx="7" fill="#ffffff" stroke="#e4e7ee" stroke-width="1"/>
  <text x="484" y="276" fill="#1c202a" font-size="12px" font-weight="600">从不发送</text>
  <text x="484" y="296" fill="#687082" font-size="10px">• 窗口标题（始终不发）</text>
  <text x="484" y="313" fill="#687082" font-size="10px">• 每小时小结只用「应用 → 时长」</text>
  <text x="484" y="330" fill="#687082" font-size="10px">• 自动发言只发应用名</text>

  <rect x="464" y="352" width="216" height="72" rx="7" fill="#fafbfd" stroke="#e4e7ee" stroke-width="1"/>
  <text x="484" y="375" fill="#1c202a" font-size="12px" font-weight="600">凭据落在哪</text>
  <text x="484" y="394" fill="#687082" font-size="10px">%LOCALAPPDATA%\AzhuPet\</text>
  <text x="484" y="411" fill="#969dac" font-size="10px">不在同步目录、不进仓库</text>

  <text x="20" y="466" fill="#687082" font-size="10px">两个读屏开关是分开的，这个设计是有意的：只开第一个＝她读得到字但只在本机自己判断；两个都开＝原文才会进入发给模型的提示词。</text>
</svg>
