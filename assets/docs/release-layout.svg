<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="720" height="416" font-family="'Consolas','Cascadia Mono','Courier New',monospace">
  <text x="20" y="30" fill="#1c202a" font-size="15px" font-weight="600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">解压后是什么 —— 四个文件，位置不能动</text>
  <text x="20" y="50" fill="#687082" font-size="11px" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">从 Releases 下载的 zip 解开后长这样。右边一列说明「删了会怎样」。</text>

  <rect x="20" y="68" width="680" height="232" rx="8" fill="#ffffff" stroke="#e4e7ee" stroke-width="1"/>

  <text x="44" y="98" fill="#687082" font-size="12px">AzhuPet-v0.1.2-win-x64/</text>

  <rect x="44" y="106" width="592" height="40" rx="6" fill="#eef4ff"/>
  <text x="62" y="124" fill="#1c202a" font-size="12px">├── pet.exe</text>
  <text x="62" y="140" fill="#3e6ce0" font-size="10px">    ← 双击这个启动</text>
  <text x="612" y="124" fill="#a8442f" font-size="10px" text-anchor="end">删了就没有程序</text>

  <rect x="44" y="150" width="592" height="40" rx="6" fill="#f4f8f4"/>
  <text x="62" y="168" fill="#1c202a" font-size="12px">├── persona.md</text>
  <text x="62" y="184" fill="#687082" font-size="10px">她是「谁」：名字、称呼你的方式、说话的边界</text>
  <text x="612" y="168" fill="#a8442f" font-size="10px" text-anchor="end">删了会退回内置骨架音色</text>

  <rect x="44" y="194" width="592" height="40" rx="6" fill="#eef4ff"/>
  <text x="62" y="212" fill="#1c202a" font-size="12px">├── WebView2Loader.dll</text>
  <text x="62" y="228" fill="#687082" font-size="10px">浏览器登录要用的原生库（没打进 exe，只能并排放）</text>
  <text x="612" y="212" fill="#a8442f" font-size="10px" text-anchor="end">删了浏览器登录会报错</text>

  <rect x="44" y="238" width="592" height="54" rx="6" fill="#fdf4f2"/>
  <text x="62" y="256" fill="#1c202a" font-size="12px">└── model/</text>
  <text x="62" y="276" fill="#1c202a" font-size="12px">    └── chibi_maid_pet.glb</text>
  <text x="316" y="276" fill="#687082" font-size="10px">3D 模型，13 MB</text>
  <text x="612" y="256" fill="#a8442f" font-size="10px" text-anchor="end">删了双击直接弹错并退出</text>

  <rect x="20" y="320" width="330" height="84" rx="8" fill="#fdf4f2" stroke="#eccfc8" stroke-width="1"/>
  <text x="40" y="342" fill="#a8442f" font-size="12px" font-weight="600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">⚠ 别把 pet.exe 单独拖出来</text>
  <text x="40" y="362" fill="#687082" font-size="10px" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">它就靠同目录的 model/ 找模型，靠同目录的</text>
  <text x="40" y="378" fill="#687082" font-size="10px" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">persona.md 知道「自己是谁」——要搬就整个文件夹搬。</text>

  <rect x="370" y="320" width="330" height="84" rx="8" fill="#f2f6fe" stroke="#c9d8f6" stroke-width="1"/>
  <text x="390" y="342" fill="#2d54b4" font-size="12px" font-weight="600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">用安装程序装的话，这些都不用管</text>
  <text x="390" y="362" fill="#687082" font-size="10px" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">setup.exe 会把同样四个文件放进安装目录，</text>
  <text x="390" y="378" fill="#687082" font-size="10px" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">并建好快捷方式与卸载项。</text>
  <text x="390" y="394" fill="#a8442f" font-size="10px" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">别选「给所有用户安装」，那会装到 Program Files。</text>
</svg>
