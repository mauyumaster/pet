<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <text x="20" y="30" fill="#1c202a" font-size="15px" font-weight="600">自动更新 —— 能查、能下，但不悄悄换掉自己</text>
  <text x="20" y="50" fill="#687082" font-size="11px">替换发生时，她正占用着自己的 exe 和人格文件。所以「什么时候换」是这条链路上最讲究的一件事。</text>

  <rect x="20" y="72" width="150" height="62" rx="8" fill="#ffffff" stroke="#cdd5e6" stroke-width="1"/>
  <text x="95" y="98" fill="#1c202a" font-size="11px" text-anchor="middle" font-weight="600">① 检查更新</text>
  <text x="95" y="116" fill="#687082" font-size="10px" text-anchor="middle">拉 version.json</text>

  <line x1="170" y1="103" x2="206" y2="103" stroke="#b9c2d6" stroke-width="1.4"/>
  <path d="M206 103 l-7 -4 v8 z" fill="#b9c2d6"/>

  <rect x="212" y="72" width="150" height="62" rx="8" fill="#ffffff" stroke="#cdd5e6" stroke-width="1"/>
  <text x="287" y="98" fill="#1c202a" font-size="11px" text-anchor="middle" font-weight="600">② 比较版本号</text>
  <text x="287" y="116" fill="#687082" font-size="10px" text-anchor="middle">逐段转数字，不用字符串</text>

  <line x1="362" y1="103" x2="398" y2="103" stroke="#b9c2d6" stroke-width="1.4"/>
  <path d="M398 103 l-7 -4 v8 z" fill="#b9c2d6"/>

  <rect x="404" y="72" width="150" height="62" rx="8" fill="#ffffff" stroke="#cdd5e6" stroke-width="1"/>
  <text x="479" y="98" fill="#1c202a" font-size="11px" text-anchor="middle" font-weight="600">③ 下载 zip</text>
  <text x="479" y="116" fill="#687082" font-size="10px" text-anchor="middle">落进 staging 暂存区</text>

  <line x1="554" y1="103" x2="594" y2="103" stroke="#b9c2d6" stroke-width="1.4"/>
  <path d="M594 103 l-7 -4 v8 z" fill="#b9c2d6"/>

  <rect x="596" y="72" width="104" height="62" rx="8" fill="#fff8e8" stroke="#ecd9a8" stroke-width="1"/>
  <text x="648" y="98" fill="#8a6a1f" font-size="11px" text-anchor="middle" font-weight="600">④ 等你点</text>
  <text x="648" y="116" fill="#a08a52" font-size="10px" text-anchor="middle">「重启并更新」</text>

  <path d="M648 134 v34 h-553 v22" stroke="#b9c2d6" stroke-width="1.4" fill="none"/>
  <path d="M95 190 l-4 -7 h8 z" fill="#b9c2d6"/>

  <rect x="20" y="196" width="534" height="98" rx="8" fill="#f2f6fe" stroke="#c9d8f6" stroke-width="1"/>
  <text x="40" y="221" fill="#2d54b4" font-size="12px" font-weight="600">⑤ 下次启动时替换（此刻还没人碰过这两个文件，最干净的时机）</text>

  <rect x="40" y="236" width="240" height="44" rx="6" fill="#ffffff" stroke="#c9d8f6" stroke-width="1"/>
  <text x="160" y="256" fill="#1c202a" font-size="10px" text-anchor="middle">pet.exe → pet.exe.old</text>
  <text x="160" y="271" fill="#969dac" font-size="10px" text-anchor="middle">旧版留成 .old，可回滚</text>

  <text x="292" y="262" fill="#2d54b4" font-size="11px">→  新文件挪成 pet.exe</text>

  <text x="40" y="288" fill="#687082" font-size="10px">实测确认：Windows 允许正在运行的进程重命名自己的 exe（是改名，不是删除）—— 所以不需要独立进程。</text>

  <rect x="572" y="196" width="128" height="98" rx="8" fill="#ffffff" stroke="#e4e7ee" stroke-width="1"/>
  <text x="636" y="220" fill="#1c202a" font-size="11px" text-anchor="middle" font-weight="600">守卫条件</text>
  <text x="588" y="241" fill="#687082" font-size="10px">• 只在严格更新时替换</text>
  <text x="588" y="257" fill="#687082" font-size="10px">• 不会把用户降级</text>
  <text x="588" y="273" fill="#687082" font-size="10px">• 失败自动回滚</text>

  <rect x="20" y="314" width="680" height="66" rx="8" fill="#fdf4f2" stroke="#eccfc8" stroke-width="1"/>
  <text x="40" y="338" fill="#a8442f" font-size="12px" font-weight="600">为什么 pet.exe 和 persona.md 必须一起换</text>
  <text x="40" y="357" fill="#687082" font-size="10px">payload 里缺任何一个，整包作废。只换程序不换人格 ＝「新程序配旧人格」，她说话会是错的 ——</text>
  <text x="40" y="373" fill="#687082" font-size="10px">这正是本项目记过的「同一份数据两个落点，迟早不一致」那个坑。</text>

  <line x1="20" y1="398" x2="700" y2="398" stroke="#e4e7ee" stroke-width="1"/>
  <text x="20" y="420" fill="#1c202a" font-size="11px" font-weight="600">唯一的维护地址：</text>
  <text x="132" y="420" fill="#3e6ce0" font-size="11px">https://raw.githubusercontent.com/mauyumaster/pet/main/version.json</text>
  <text x="20" y="440" fill="#687082" font-size="10px">发版后最容易忘的一步是「把 version.json 提交并推送」—— 不提交，raw 地址服务的就是旧版本号，用户永远收不到提示，而本地一切正常。</text>
  <text x="20" y="458" fill="#969dac" font-size="10px">自查：pet.exe --updatediag（或双击 diag-update.cmd），会逐段量出代理是什么、feed 拉到没、下载资产真的存在吗。</text>
</svg>
